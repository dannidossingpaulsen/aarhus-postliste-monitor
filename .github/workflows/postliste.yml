name: Aarhus postliste monitor

on:
  workflow_dispatch:
  schedule:
    # 06 UTC = 08 dansk sommertid
    # 07 UTC = 08 dansk vintertid
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine whether this run is active
        id: timing
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manuel kørsel - fortsætter."
            exit 0
          fi

          OFFSET=$(TZ=Europe/Copenhagen date +%z)
          SCHEDULE="${{ github.event.schedule }}"

          echo "Dansk UTC-offset: $OFFSET"
          echo "Udløsende schedule: $SCHEDULE"
          echo "Aktuel dansk tid: $(TZ=Europe/Copenhagen date)"

          if [ "$OFFSET" = "+0200" ] && [ "$SCHEDULE" = "0 6 * * 1-5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dansk sommertid - denne kørsel er aktiv."
          elif [ "$OFFSET" = "+0100" ] && [ "$SCHEDULE" = "0 7 * * 1-5" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dansk vintertid - denne kørsel er aktiv."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Backup-kørsel - springer over."
          fi

      - uses: actions/setup-python@v5
        if: steps.timing.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch postlists
        if: steps.timing.outputs.run == 'true'
        run: python monitor.py

      - name: Send email briefing
        if: steps.timing.outputs.run == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py

      - name: Commit data
        if: steps.timing.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Update Aarhus postlists"
            git push
          fi
