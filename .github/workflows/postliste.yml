name: Aarhus postliste monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Copenhagen time
        id: localtime
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Copenhagen date +%H)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"
          echo "København: $(TZ=Europe/Copenhagen date)"

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.hour == '08'
        with:
          python-version: "3.12"

      - name: Fetch postlists
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.hour == '08'
        run: python monitor.py

      - name: Commit data
        if: github.event_name == 'workflow_dispatch' || steps.localtime.outputs.hour == '08'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Ingen ændringer."
          else
            git commit -m "Update Aarhus postlists"
            git push
          fi
